<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adaptive AI">
<title>Adaptive AI</title>
<style>
:root{--accent:#8ab4ff;--opacity:.24;--blur:22px;--glow:.32}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f7ff}
body{background:#07090e;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:55vw;height:55vw;border-radius:50%;filter:blur(70px);opacity:.35;z-index:-2}
body:before{background:var(--accent);top:-28vw;left:-18vw}body:after{background:#6c4dff;right:-25vw;bottom:-30vw}
.app{max-width:900px;margin:auto;min-height:100vh;padding:18px 16px 110px}
.glass{background:color-mix(in srgb,var(--accent) 8%,rgba(20,23,31,var(--opacity)));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 18px 60px rgba(0,0,0,.35),0 0 45px color-mix(in srgb,var(--accent) calc(var(--glow)*100%),transparent);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%)}
.top{height:62px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 16px}
.brand{font-weight:800;letter-spacing:.2px}.brand span{color:var(--accent)}
.icon{width:44px;height:44px;border-radius:15px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-size:20px}
.hero{text-align:center;padding:16vh 10px 7vh}.eyebrow{display:inline-block;padding:7px 12px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#cdd7ef}.hero h1{font-size:clamp(36px,9vw,68px);line-height:.98;margin:18px 0 14px;letter-spacing:-2.5px}.hero h1 span{color:var(--accent)}.hero p{max-width:620px;margin:auto;color:#aeb7cb;line-height:1.6}
.suggestions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:28px auto;max-width:700px}.pill,.send,.stylebtn{border:1px solid rgba(255,255,255,.15);color:#fff;background:rgba(255,255,255,.07);cursor:pointer}.pill{padding:11px 14px;border-radius:99px}.pill:hover,.send:hover{border-color:color-mix(in srgb,var(--accent) 70%,white);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 28%,transparent)}
.composer{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);width:min(850px,calc(100% - 24px));border-radius:25px;padding:9px;display:flex;gap:8px;z-index:5}.composer textarea{flex:1;min-width:0;resize:none;max-height:130px;border:0;outline:0;background:transparent;color:#fff;padding:13px 11px;font:inherit}.composer textarea::placeholder{color:#8993a8}.send{width:48px;height:48px;border-radius:17px;background:color-mix(in srgb,var(--accent) 24%,rgba(255,255,255,.06));font-size:20px}
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(470px,calc(100% - 28px));height:54px;border-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:6}.nav button{border:0;background:transparent;color:#9ca7bc;padding:9px 14px;border-radius:14px}.nav button.active{color:#fff;background:rgba(255,255,255,.09)}
.panel{position:fixed;inset:0 0 0 auto;width:min(390px,94vw);padding:18px;transform:translateX(105%);transition:.3s;z-index:10;overflow:auto}.panel.open{transform:translateX(0)}.panel h2{margin-top:8px}.close{float:right}.row{margin:18px 0}.row label{display:flex;justify-content:space-between;color:#cbd3e4;font-size:14px;margin-bottom:9px}.row input[type=range]{width:100%}.styles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stylebtn{padding:12px;border-radius:15px}.stylebtn.active{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=color]{width:52px;height:38px;padding:3px;border:0;background:transparent}
@media(max-width:600px){.app{padding-top:10px}.hero{padding-top:13vh}.hero h1{font-size:46px}.composer{bottom:70px}.nav{bottom:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top glass"><div class="brand">Adaptive <span>AI</span></div><button class="icon" onclick="openSettings()">⚙</button></header>
<main>
<section class="hero">
<div class="eyebrow">Personal AI • Liquid Glass</div>
<h1>What can I <span>help</span> you with?</h1>
<p>A glossy, customizable AI chat experience designed to learn your preferences over time.</p>
<div class="suggestions">
<button class="pill" onclick="fill('Explain something simply')">Explain something</button>
<button class="pill" onclick="fill('Help me plan my day')">Plan my day</button>
<button class="pill" onclick="fill('Teach me something interesting')">Teach me</button>
</div>
</section>
</main>
<div class="composer glass"><textarea id="prompt" rows="1" placeholder="Message Adaptive AI…" oninput="grow(this)"></textarea><button class="send" onclick="send()">↑</button></div>
<nav class="nav glass"><button class="active">⌂<br><small>Home</small></button><button>◫<br><small>Chats</small></button><button>✦<br><small>Memory</small></button><button onclick="openSettings()">⚙<br><small>Settings</small></button></nav>
</div>
<aside id="panel" class="panel glass">
<button class="icon close" onclick="openSettings()">×</button><h2>Appearance</h2>
<div class="row"><label>Accent color <input id="accent" type="color" value="#8ab4ff"></label></div>
<div class="row"><label>Glass opacity <span id="ov">24%</span></label><input id="opacity" type="range" min="10" max="40" value="24"></div>
<div class="row"><label>Blur <span id="bv">22px</span></label><input id="blur" type="range" min="8" max="40" value="22"></div>
<div class="row"><label>Glow <span id="gv">32%</span></label><input id="glow" type="range" min="0" max="70" value="32"></div>
<div class="row"><label>Button style</label><div class="styles"><button class="stylebtn active">Liquid</button><button class="stylebtn">Crystal</button><button class="stylebtn">Bubble</button><button class="stylebtn">Minimal</button></div></div>
<p style="color:#9da8bc;font-size:13px;line-height:1.6">Prototype only: the visual interface is live. The real AI backend and behavior-learning system will be connected next.</p>
</aside>
<script>
const root=document.documentElement;
function openSettings(){document.getElementById('panel').classList.toggle('open')}
function fill(x){const p=document.getElementById('prompt');p.value=x;p.focus();grow(p)}
function grow(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,130)+'px'}
function send(){const p=document.getElementById('prompt');if(!p.value.trim())return;alert('Prototype mode — AI backend comes next.\\n\\nYour message: '+p.value)}
accent.oninput=e=>root.style.setProperty('--accent',e.target.value);
opacity.oninput=e=>{root.style.setProperty('--opacity',e.target.value/100);ov.textContent=e.target.value+'%'};
blur.oninput=e=>{root.style.setProperty('--blur',e.target.value+'px');bv.textContent=e.target.value+'px'};
glow.oninput=e=>{root.style.setProperty('--glow',e.target.value/100);gv.textContent=e.target.value+'%'};
document.querySelectorAll('.stylebtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.stylebtn').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
</script>
</body>
</html>
